# BLOCK-HOLDOUT config - the experiment that answers "does the model generalise to faults in
# 51 km blocks it has never seen?", as opposed to "does it restate the catalogue?".
#
# WHY THIS FILE EXISTS
#   configs/config_ci_ensemble.yaml splits a RASTER 70/30 into scattered windows
#   (training.test_proportion).  Adjacent windows of the same fault lineament can land on both
#   sides of that split, so the held-out DTI it reports is partly memorisation of continuous
#   structure.  Both prize phases score faults the catalogue does not contain (rules 1.1/3.3,
#   verbatim in data/evidence/rules_quotes.json), so the number that matters is the one measured
#   on whole spatial blocks the model never trained on.
#
#   This config turns that split on for training, and pins the SAME partition parameters that
#   scripts/block_holdout_eval.py must use when it scores the result.  The two are cross-checked
#   at runtime: `block_holdout_eval.py --config configs/config_block_holdout.yaml` exits(2) if
#   training.block_px and block_holdout_eval.block_px disagree, because a score computed on a
#   partition the model was not trained against is not a holdout score.
#
# Partition provenance (src/blocks.py): 512 px blocks = 51.2 km squares on the official 100 m
# grid, 4 folds, greedy normalised-load assignment (not absolute mass - the absolute-mass variant
# gave a [8192, 8192, 6144, 215552] valid-pixel split and is pinned as broken by
# tests/test_blocks.py::test_valid_pixel_balance_across_folds), buffer 3 px == the metric's R.
data:
  feature_path: "data/training_features.tif"
  label_path: "data/labels.tif"
  sample_submission_path: "data/sample_submission.tif"
  external_dir: "data/external"
  output_dir: "outputs"
  norm_mode: "clip_zscore"
  clip_percentile: [1.0, 99.0]
  use_external_dem: false
  use_ingenious_extra: false
  # Coded proxy raster (code 2 = the 61,664 px of SGMC trace the labels do not contain). Only read
  # when training.union_selection is on; it defines the per-epoch union hold-out population that
  # training.select_on='union' can maximise. Off here by default (in_domain selection unchanged).
  proxy_catalogue_path: "data/evidence/proxy/proxy_catalogue.tif"

training:
  holdout: "spatial_blocks"     # <- the only structural difference from config_ci_ensemble.yaml
  # MODEL SELECTION POPULATION (EXECUTIVE_SUMMARY §11 item 4).
  #   select_on: in_domain  -> early stopping / checkpoint / manifest DTI maximise the SHAPED
  #                            in-domain DTI (the labels the model trained near); the default and
  #                            the reference solution's behaviour.
  #   select_on: union      -> they maximise the UNION-population DTI logged each epoch
  #                            (labels | proxy code 2), the closest local surrogate for the Phase-2
  #                            scored set. Requires union_selection: true (below) + proxy path above.
  # The manifest 'dti' the ensemble weighting (blend_submission.py --weights dti) reads is this
  # same selected statistic, so choosing 'union' feeds the union signal into BOTH early stopping
  # and the ensemble weights, which is the wiring item 4 asks for.
  select_on: in_domain
  union_selection: false        # true -> score the union population on the hold-out each epoch
  block_px: 512                 # 51.2 km squares; MUST equal block_holdout_eval.block_px
  block_folds: 4                # whole blocks held out, one fold per job
  block_fold: null              # null -> mc_id % block_folds (workflows set mc_id per job)
  block_mode: "balanced"        # greedy normalised-load fold assignment (src/blocks.assign_folds)
  block_seed: 0                 # partition seed - NOT the fold seed, so all folds share the map
  block_buffer_px: null         # null -> DEFAULT_BUFFER_PX (3 px == the metric's R at 100 m)

  patch_size: 256               # a 256 px window fits inside a 512 px block, so a window can
                                # never straddle the train/holdout boundary once the collar is
                                # applied (measured geometry, tests/test_spatial_holdout.py)
  train_step: 128
  test_proportion: 0.3          # ignored under spatial_blocks, kept for diffability
  neg_fraction: 0.35
  mc_id: 0
  mc_splits: 1
  batch_size: 8
  epochs: 45
  max_minutes: 150
  init_lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: onecycle
  alpha: 0.2                    # official metric (problem page, Performance metric)
  beta: 0.8
  loss: combined_dw
  use_global_fp_weight: true
  augment: true
  noise_std: 0.01
  rand_crop_scale: [0.75, 1.0]
  early_stopping_patience: 10
  num_workers: 2
  seed: 42
  good_channels: null
  calibrate_shaping: true
  selection_mode: raw
  shaping_grid: 11
  shaping_windows: 12

model:
  architectures: ["unetplusplus", "deeplabv3plus", "unet"]
  encoder: "resnet34"
  segformer_encoder: "mit_b2"
  pretrained: true
  in_channels: null
  classes: 1

inference:
  overlap: 0.5
  batch_size: 8
  tta: true
  threshold: null
  blend_mode: gaussian
  ensemble_weights: null
  submission_shaping:
    t0: null
    thin: null
    hard: true
    gamma: 1.0

postprocess:
  frangi_filter: false
  frangi_scale_range: [1, 6]
  frangi_weight: 0.35
  morphological_closing: true
  closing_kernel: 3
  min_fault_length: 5
  skeletonize: false

metric:
  R_meters: 300
  resolution_m: 100
  alpha: 0.2
  beta: 0.8
  epsilon: 1.0e-7

# ---------------------------------------------------------------------------
# Measurement side (scripts/block_holdout_eval.py --config this-file)
#
# Every value here is a MEASURED default, not a guess:
#   block_px / folds          must equal training.block_px / training.block_folds (checked)
#   floors 0.1..0.5           the shipped raster is a HARD band (2 distinct values), so the floor
#                             axis is degenerate: measured 2026-09-18, 5 floors x 10 widths swept
#                             -> only 10 DISTINCT emissions.  The sweep keeps the floors anyway
#                             because the report says so explicitly (verdict.floor_axis_degenerate)
#                             rather than implying 50 independent measurements.
#   widths 0..20 px           widening is monotonically harmful on both populations
#                             (proxy 0.0999 -> 0.0670, catalogue 0.2298 -> 0.0652 at 20 px)
#   reference floor/width     the ADOPTED policy (floor 0.1, width 0) - the contrast every
#                             bootstrap P(>ref) is computed against
#   bootstraps 2000           paired block bootstrap over 33-34 scoreable blocks; 2000 resamples
#                             is ~40 s and the CI95 half-width is stable to +-0.0002
# ---------------------------------------------------------------------------
block_holdout_eval:
  block_px: 512
  folds: 4
  floors: "0.1,0.15,0.2,0.3,0.5"
  widths: "0,1,2,3,4,6,8,12,16,20"
  reference_floor: 0.1
  reference_width: 0
  bootstraps: 2000
  seed: 0
  R: 3
  alpha: 0.2
  beta: 0.8
  eps: 1.0e-7
  crosscheck_sweep: "data/evidence/proxy/eval_sweep-mean12.json"
  out: "data/evidence/block_holdout/block_stratified.json"
