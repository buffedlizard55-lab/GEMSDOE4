name: Place competition data (git bridge)

# =============================================================================
# DATA PLACEMENT BRIDGE (2026-09-17)
#
# The dev sandbox egresses through an allowlist (github.com + api.github.com +
# codeload.github.com + pypi.org only): Dropbox, S3, DrivenData and the Azure
# host that serves workflow ARTIFACTS are all unreachable from there, so
# artifacts cannot move the competition rasters into the sandbox.
#
# This workflow moves them the only way that survives the allowlist: as git
# blobs on this branch.  GitHub rejects single blobs >= 100 MB, so the
# 418,912,844-byte feature stack is committed as ~90 MiB parts in
# data/bridge/ together with the two small rasters and a manifest whose
# sha256 pins come from the independent, machine-measured inventory
# (data/evidence/inventory.json, scripts/inspect_competition_data.py,
# GitHub-hosted runner, 2026-09-14).
#
# Receiving side (idempotent, no manual input, refuses on any mismatch):
#   python scripts/assemble_data_bridge.py
#   python scripts/prepare_data.py
#
# Provenance of the bytes: the Dropbox mirror URLs printed on the official
# DrivenData data tab (the tab itself requires login; the mirrors do not).
# The build FAILS LOUDLY if any downloaded file no longer matches the pinned
# sha256, so link-rot or silent replacement cannot enter the repo unnoticed.
# =============================================================================
on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths: [".github/triggers/place-data"]

permissions:
  contents: write

concurrency:
  group: place-data-${{ github.ref }}

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (full history - this job pushes a commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the official rasters from the data-tab Dropbox mirrors
        run: |
          set -euo pipefail
          mkdir -p data
          dl () { # url outfile
            echo "::group::$2"
            curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 -o "data/$2" "$1"
            echo "$2: $(stat -c%s "data/$2") bytes"
            echo "::endgroup::"
          }
          dl "https://www.dropbox.com/scl/fi/3vz9o0wwavi26xaeoxlwr/gems-geodawn-numerical-features.tif?rlkey=je8d8fepqfbst9lnwsq9rkplu&dl=1" gems-geodawn-numerical-features.tif
          dl "https://www.dropbox.com/scl/fi/t7fyt03qdh9egyme0itwo/existing_faults.tif?rlkey=yiao96uluqdkipf0h5vju71jf&dl=1" existing_faults.tif
          dl "https://www.dropbox.com/scl/fi/6rgvnuady818ol8yqgis4/example_submission.tif?rlkey=kbykilvau066xuogoosbf4cq8&dl=1" example_submission.tif

      - name: Verify sha256 against the pinned inventory (fail loudly on drift)
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          inv = json.loads(Path("data/evidence/inventory.json").read_text())
          pins = {f["name"]: f for f in inv["files"] if f["name"].endswith(".tif")}
          ok = True
          for name, meta in sorted(pins.items()):
              p = Path("data") / name
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              match = (h == meta["sha256"]) and (p.stat().st_size == meta["bytes"])
              print(f"{'OK  ' if match else 'FAIL'} {name}: {p.stat().st_size} B sha256 {h}")
              ok = ok and match
          sys.exit(0 if ok else 1)
          PY

      - name: Install pre-flight deps (src.dataset imports torch.utils.data)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet rasterio numpy pyyaml

      - name: Pre-flight validation of the real bytes (canonical names)
        run: |
          set -euo pipefail
          cp data/gems-geodawn-numerical-features.tif data/training_features.tif
          cp data/existing_faults.tif                 data/labels.tif
          cp data/example_submission.tif              data/sample_submission.tif
          python scripts/prepare_data.py

      - name: Build the bridge (chunked parts + sha256 manifest)
        run: python scripts/make_data_bridge.py --data-dir data --out data/bridge

      - name: Commit the bridge to this branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/bridge
          if git diff --cached --quiet; then
            echo "bridge unchanged - nothing to commit"
          else
            git commit -m "data(bridge): place official competition rasters as sha256-pinned parts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
